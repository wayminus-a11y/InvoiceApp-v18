<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Invoice Manager</title>
<style>:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--ok:#059669;--bad:#e11d48;--dk:#d97706;--sb:#4f46e5;--tt:#7c3aed;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px #0003}
.top h1{font-size:18px;margin:0;flex:1;font-weight:700;line-height:1.2}
.top h1 small{display:block;font-size:11px;font-weight:500;opacity:.85}
.top .ib{background:#ffffff26;border:0;color:#fff;border-radius:12px;min-width:40px;height:40px;font-size:18px;padding:0 10px}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,#0f172a,#1e293b 60%,#334155);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
.hero h2{margin:0 0 2px;font-size:22px}.hero p{margin:0;opacity:.75;font-size:13px}
.cards{display:grid;gap:14px}
.bcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 12px #0f172a14}
.bhead{color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.bhead span.e{font-size:24px}
.bstats{display:flex;padding:14px 16px;gap:10px}
.bstats div{flex:1;text-align:center}.bstats b{display:block;font-size:26px}.bstats small{color:var(--mute)}
.bact{display:flex;gap:10px;padding:0 14px 14px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 8px #0002;transition:transform .08s}
.btn:active{transform:scale(.97)}.btn.f{flex:1}.btn.sm{padding:9px 12px;font-size:14px;border-radius:12px}
.btn.ok{background:var(--ok)}.btn.ind{background:#4f46e5}.btn.am{background:#d97706}.btn.sk{background:#0284c7}.btn.vi{background:#7c3aed}.btn.sl{background:#475569}.btn.ro{background:var(--bad)}.btn.gh{background:#e2e8f0;color:#0f172a;box-shadow:none}
.sec{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 2px 12px #0f172a10}
.sec h3{margin:0 0 10px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .full{grid-column:1/-1}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mute)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;color:var(--ink);background:#f8fafc;outline:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--ac,#4f46e5);background:#fff;box-shadow:0 0 0 3px #4f46e522}
.big{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.big small{opacity:.85}.big b{display:block;font-size:28px;margin:2px 0}.big em{font-style:normal;font-size:13px;opacity:.95}
.item{border:1.5px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fcfcfd}
.item .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.item .amt{color:var(--ok);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fffffff2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.bar .btn{flex:1;max-width:220px;padding:13px 4px;font-size:13px}
.entry{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 8px #0f172a10;border-left:6px solid var(--ac)}
.entry .l1{display:flex;justify-content:space-between;font-weight:700}.entry .l2{color:var(--mute);font-size:13px;margin-top:2px}
.entry .acts{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}.entry.open .acts{display:flex}
.tag{font-size:11px;background:#e2e8f0;border-radius:99px;padding:2px 8px;margin-left:6px;font-weight:600;color:#334155}
.search{position:sticky;top:64px;z-index:10;margin-bottom:12px}
.search input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);font-size:16px;background:#fff}
.stage{background:#94a3b8;padding:12px;border-radius:14px}
#printPage{background:#fff;box-shadow:0 4px 20px #0006;max-width:100%;margin:0 auto}
#printPage svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 16px;border-radius:14px;z-index:90;max-width:92%;font-size:14px;box-shadow:0 6px 20px #0006;animation:pop .2s}
.toast.err{background:var(--bad)}.toast.good{background:var(--ok)}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
.modal{position:fixed;inset:0;background:#0f172a99;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.modal h4{margin:0 0 6px;font-size:18px}.modal p{margin:0 0 14px;color:var(--mute);white-space:pre-line}
.modal .row{display:flex;gap:8px;flex-wrap:wrap}.modal .row .btn{flex:1;min-width:30%}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}.sw input{width:22px;height:22px}
.mute{color:var(--mute);font-size:13px}
@media print{body *{visibility:hidden}#printPage,#printPage *{visibility:visible}#printPage{position:absolute;left:0;top:0;width:210mm;height:297mm;box-shadow:none}#printPage svg{width:210mm;height:297mm}@page{size:A4;margin:0}}


/* ---------- bottom dock (all tabs) ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:720px;margin:0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 18px rgba(15,23,42,.10);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.drow{display:grid;gap:5px}.drow+.drow{margin-top:5px}
.db{border:0;border-radius:10px;padding:0 2px;font-weight:800;line-height:1.12;white-space:pre-line;text-align:center;display:flex;align-items:center;justify-content:center;font-family:inherit}
.db:active{transform:scale(.96)}
.drow.pri .db{height:36px;font-size:10.5px;background:var(--c,#4f46e5);color:#fff;box-shadow:0 2px 5px rgba(15,23,42,.18)}
.drow.sec .db{height:32px;font-size:9.5px;background:#f1f5f9;color:var(--c,#334155);border:1px solid #e2e8f0;font-weight:800}
.toast{bottom:calc(112px + env(safe-area-inset-bottom))}
/* ---------- dialogs ---------- */
.modal.c{align-items:center;padding:16px}
.modal .box{border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal:not(.c) .box{border-radius:22px 22px 0 0}
.modal .row .btn{padding:11px 8px;font-size:14px}
.modal .box.big{max-width:360px;border-radius:24px;padding:22px 18px;position:relative}
.pclose{position:absolute;right:10px;top:10px;border:0;background:#f1f5f9;border-radius:50%;width:32px;height:32px;font-size:15px}
/* ---------- PIN pad / lock ---------- */
.ppad{text-align:center}.ppad h3{margin:6px 0 4px;font-size:19px}
.pmsg{min-height:20px;font-size:13px;color:var(--mute);margin-bottom:10px}.pmsg.bad{color:var(--bad);font-weight:700}
.pdots{display:flex;gap:12px;justify-content:center;margin:6px 0 16px}.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid #94a3b8;display:block}.pdots i.on{background:#4f46e5;border-color:#4f46e5}
.pdots.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:270px;margin:0 auto}
.pk{height:56px;border-radius:16px;border:0;background:#f1f5f9;font-size:22px;font-weight:700;color:#0f172a;font-family:inherit}.pk:active{background:#e2e8f0;transform:scale(.96)}
.plink{display:block;margin:12px auto 0;border:0;background:none;color:#4f46e5;font-weight:700;font-size:14px;font-family:inherit}.plink.big{background:#eef2ff;border-radius:12px;padding:11px 16px}
.lockscr{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#0f172a,#1e1b4b 60%,#312e81);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lockscr .lockico{font-size:44px;margin-bottom:6px}
.lockscr .ppad{background:#fff;border-radius:26px;padding:22px 18px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
/* ---------- settings ---------- */
.scard{background:#fff;border-radius:18px;padding:14px 14px 8px;margin-bottom:14px;box-shadow:0 2px 14px rgba(15,23,42,.07)}
.scard h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eef2f7}.srow:last-child{border:0}
.srow.tap:active{background:#f8fafc}.sic{width:36px;height:36px;border-radius:11px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.stx{flex:1;min-width:0}.stx b{display:block;font-size:15px}.stx small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.chev{font-size:24px;color:#94a3b8}.chev.bad{color:var(--bad)}
.tg{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:#cbd5e1;position:relative;transition:.2s;flex:none;margin:0;outline:0;border:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.tg:checked{background:#059669}.tg:checked::after{left:21px}.tg:disabled{opacity:.45}
.ssel{border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;font:inherit;font-size:13px;background:#f8fafc}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}.grid2 .btn{padding:12px 6px;font-size:13px;box-shadow:none}
.strip{display:flex;align-items:center;gap:12px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:14px;padding:10px 12px;margin:10px 0}
.strip.warn{background:#fffbeb;border-color:#fde68a}.strip span{font-size:22px}.strip div{flex:1}.strip b{display:block;font-size:14px}.strip small{display:block;color:#475569;font-size:12px}

/* register selection */
.entry{cursor:pointer;position:relative;border:2px solid transparent;transition:background .15s,box-shadow .15s}
.entry.picked{background:#eef2ff;border-color:var(--ac);box-shadow:0 4px 16px rgba(79,70,229,.25)}
.seltag{margin-left:6px;font-size:10px;font-weight:800;background:var(--ac);color:#fff;border-radius:99px;padding:2px 8px;vertical-align:middle}
.selbar{position:sticky;top:126px;z-index:9;margin:0 0 10px;padding:8px 12px;border-radius:12px;background:#e2e8f0;color:#475569;font-size:12.5px;font-weight:600}
.selbar.on{background:#dcfce7;color:#166534}
.search{top:64px}
</style></head>

<script>/* ===================== CORE: helpers, words, layout, PDF, XLSX ===================== */
'use strict';
const PT = 25.4 / 72;            // 1 pt in mm
const PAGE_W = 210, PAGE_H = 297;

/* ---------- small helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function num(v) { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function isNum(v) { return v !== '' && v != null && isFinite(parseFloat(String(v).replace(/,/g, ''))); }
function r2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function p2(n) { return (n < 10 ? '0' : '') + n; }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function nowTime() { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function dmy(iso) { if (!iso) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m ? m[3] + '/' + m[2] + '/' + m[1] : iso; }
function money(n) { return r2(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function plain2(n) { return r2(n).toFixed(2); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function safeName(s) { return String(s || '').replace(/[\\\/:*?"<>|\r\n]+/g, '_').trim().replace(/\s+/g, '_').slice(0, 30); }
function excelSerial(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); if (!m) return ''; return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 86400000); }
function excelSerialDT(iso) { const d = new Date(iso); if (isNaN(d)) return ''; return (d.getTime() - d.getTimezoneOffset() * 60000) / 86400000 + 25569; }
function excelTime(hhmm) { const m = /^(\d{1,2}):(\d{2})/.exec(hhmm || ''); return m ? (+m[1] * 60 + +m[2]) / 1440 : ''; }

/* ---------- numbers to words (same logic as the Excel/VBA version) ---------- */
const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function below100(n) { return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : ''); }
function below1000(n) { const h = Math.floor(n / 100), r = n % 100; return h ? below100(h) + ' hundred' + (r ? ' ' + below100(r) : '') : below100(r); }
function wordsWestern(n) {
  const nm = ['', ' thousand', ' million', ' billion', ' trillion']; let parts = '', i = 0;
  while (n > 0 && i <= 4) { const g = n % 1000; n = Math.floor(n / 1000); if (g) parts = below1000(g) + nm[i] + (parts ? ' ' + parts : ''); i++; }
  return parts;
}
function wordsIndian(n) {
  const cr = Math.floor(n / 1e7); let rest = n - cr * 1e7; const lk = Math.floor(rest / 1e5); rest -= lk * 1e5;
  const th = Math.floor(rest / 1e3), hu = rest - th * 1e3; let s = '';
  if (cr) s = wordsWestern(cr) + ' crore';
  if (lk) s += (s ? ' ' : '') + below100(lk) + ' lakh';
  if (th) s += (s ? ' ' : '') + below100(th) + ' thousand';
  if (hu) s += (s ? ' ' : '') + below1000(hu);
  return s;
}
function amountWords(v, lakh) {
  if (!isNum(v)) return '';
  let n = r2(Math.abs(num(v))), paise = Math.round(n * 100), rup = Math.floor(paise / 100), pai = paise % 100;
  let s = rup === 0 ? 'zero' : (lakh ? wordsIndian(rup) : wordsWestern(rup));
  s += rup === 1 ? ' rupee' : ' rupees';
  s += pai ? ' and ' + below100(pai) + (pai === 1 ? ' paisa' : ' paise') : ' only';
  if (num(v) < 0) s = 'minus ' + s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function netWords(v) {
  if (v === '' || v == null || !isFinite(v)) return '';
  const n = Math.round(Math.abs(v) * 1000) / 1000; const m = { 0: 'ZERO', 1: 'ONE', 2: 'TWO', 3: 'THREE', 4: 'FOUR', 5: 'FIVE', 6: 'SIX', 7: 'SEVEN', 8: 'EIGHT', 9: 'NINE', '.': 'POINT' };
  let out = ''; for (const ch of String(n)) out += (m[ch] || '') + ' ';
  return (v < 0 ? 'MINUS ' : '') + out + 'KG';
}

/* ---------- bill calculations ---------- */
function calcDK(d) {

}
function calcSB(d, lakh) {

    String(it.notes || '').split('\n').forEach(t => { if (t.trim()) lines.push({ p: t }); });

  });

  return { lines, sum: r2(sum), total, words: total > 0 ? amountWords(total, lakh) : '', bags, qty, parts: parts.join('; '), rate: multi ? 'Multiple' : (rate1 == null ? '' : rate1) };

<script>/* ===== ONE macro workbook (Invoice_Bill.xlsm): all bills are written into the 3 Register tabs exactly like the VBA does ===== */
const XLSM_NAME = 'Invoice_Bill.xlsm', XLSM_MIME = 'application/vnd.ms-excel.sheet.macroEnabled.12';
const DK_CELLS = ['D5', 'I5', 'D6', 'I6', 'D7', 'D10', 'D11', 'G10', 'G11', 'O4', 'O5', 'O6'];
function sbCells() { const a = ['B9', 'B10', 'B11', 'B12', 'F9', 'F10', 'F11', 'F12', 'H9', 'H10', 'H11', 'H12', 'H35', 'H36', 'H37']; for (let r = 17; r <= 30; r++) ['C', 'D', 'E', 'F', 'G'].forEach(c => a.push(c + r)); return a; }
function ttCells() { const a = ['J3', 'H5', 'J5', 'H7', 'J7', 'D11', 'C12', 'C13', 'C14', 'C15']; for (let r = 20; r <= 37; r++) ['C', 'H', 'I'].forEach(c => a.push(c + r)); return a; }
const CELLS = { dk: DK_CELLS, sb: sbCells(), tt: ttCells() };
const vN = v => (isNum(v) ? { n: num(v) } : (v === '' || v == null ? null : { t: String(v) }));
const vT = v => (v === '' || v == null ? null : { t: String(v) });
const vD = iso => { const s = excelSerial(iso); return s === '' ? null : { n: s }; };
const gtxt = (d, t) => 'Date : ' + dmy(d) + ' Time : ' + t;
/* app data -> {cell: value} exactly as the Excel bill form holds it */
function formCells(type, d) {
  const M = {}; const S = (a, v) => { if (v) M[a] = v; };
  if (type === 'dk') {
    S('D5', vN(d.rst)); S('I5', vT(d.vehicle)); S('D6', vT(d.customer)); S('I6', vT(d.material)); S('D7', vT(d.mobile)); S('D10', vN(d.gross)); S('D11', vN(d.tare));
    S('G10', vT(gtxt(d.gDate, d.gTime))); S('G11', vT(gtxt(d.tDate, d.tTime))); S('O4', vN(d.ch1)); S('O5', vN(d.ch2)); S('O6', vT(d.remarks));
  } else if (type === 'sb') {
    const c = calcSB(d, false);
    S('B9', vT(d.party)); S('B10', vT(d.addr1)); S('B11', vT(d.addr2)); S('B12', vT('GSTIN/UIN : ' + d.gstin)); S('F9', vN(d.challan)); S('F10', vN(d.invoice)); S('F11', vT(d.lr)); S('F12', vT(d.transport));
    S('H9', vD(d.challanDate)); S('H10', vD(d.invoiceDate)); S('H11', vD(d.lrDate)); S('H12', vT(d.article));
    S('H35', num(d.sgst) > 0 ? { n: num(d.sgst) } : { t: '-' }); S('H36', num(d.cgst) > 0 ? { n: num(d.cgst) } : { t: '-' }); S('H37', num(d.igst) > 0 ? { n: num(d.igst) } : null);
    c.lines.slice(0, MAXLINES.sb).forEach((l, k) => { const r = 17 + k; S('C' + r, vT(l.p)); S('D' + r, vN(l.bags)); S('E' + r, vT(l.hsn)); S('F' + r, vN(l.qty)); S('G' + r, vN(l.rate)); });
  } else {

}

/* ----- register ----- */
function screenReg(type) {
  const T = TYPES[type]; theme(type); const app = $('#app'); app.innerHTML = '';
  app.append(topbar(T.name + ' Register', DB[type].length + ' entries', [T.c, T.c2], { t: '←', fn: () => go('home') }));
  const w = h('div', { class: 'wrap' }); app.append(w);
  const q = h('input', { type: 'search', placeholder: '🔍  Search (name, number, vehicle...)' }); w.append(h('div', { class: 'search' }, q));
  let regSel = null; const opened = new Set(); const pick = () => { const e = DB[type].find(x => x.id === regSel); if (!e) toast('First tap an entry in the list below', 'err'); return e; };
  const dkr = dock([
    ['LOAD TO FORM', '#4f46e5', () => { const e = pick(); if (e) { cur[type] = clone(e.data); DB.drafts[type] = clone(e.data); persist(); go('form', type); } }],
    ['PRINT PREVIEW', '#0284c7', () => { const e = pick(); if (e) go('preview', type, e.id); }],
    ['SAVE AS PDF', '#6d28d9', async () => { const e = pick(); if (e) { try { toast('Saved: ' + await savePDF(type, e), 'good'); } catch (x) { toast(x.message, 'err'); } } }],
    ['SHARE', '#0891b2', () => { const e = pick(); if (e) doShare(type, e); }]
  ], [
    ['DELETE\nENTRY', '#e11d48', async () => { const e = pick(); if (!e) return; if (!await yn('Delete entry?', e.id + ' (' + T.keyLabel + ' ' + e.key + ' - ' + (whoOf(type, e.data) || '') + ') will be deleted permanently.\nAre you sure?', true)) return; DB[type] = DB[type].filter(x => x.id !== e.id); sel = sel.filter(x => x !== e.id); persist(); if (DB.settings.autoXlsx) saveXLSX().catch(() => { }); screenReg(type); }]
  ].concat(type === 'dk' ? [['SAME PAGE (0)', '#7c3aed', () => { if (!sel.length) { toast('First tick 1 to 3 bills', 'err'); return; } go('multi', sel.join(',')); }, 'same']] : [], [['GO TO\nFORM', '#d97706', () => go('form', type)], ['HOME', '#475569', () => go('home')]]));
  const mb = dkr.querySelector('[data-id=same]');
  const selbar = h('div', { class: 'selbar' }); w.append(selbar);
  const upSel = () => { const e = DB[type].find(x => x.id === regSel); selbar.className = 'selbar' + (e ? ' on' : ''); selbar.textContent = e ? '✓ Selected: ' + e.id + ' • ' + T.keyLabel + ' ' + e.key + ' • ' + (whoOf(type, e.data) || '—') : 'Tap an entry below to select it'; };
  const list = h('div', {}); w.append(list); app.append(dkr); w.style.paddingBottom = (dkr.offsetHeight + 24) + 'px';
  const draw = () => {
    list.innerHTML = ''; upSel(); const s = q.value.trim().toLowerCase();
    const arr = DB[type].slice().reverse().filter(e => !s || JSON.stringify(e.data).toLowerCase().includes(s) || (e.id + e.key).toLowerCase().includes(s));
    if (!arr.length) list.append(h('p', { class: 'mute', style: 'text-align:center;margin-top:40px' }, DB[type].length ? 'Nothing found.' : 'No entries yet. Start with "NEW BILL".'));
    arr.forEach(e => {
      const d = e.data, dt = type === 'dk' ? d.gDate : type === 'sb' ? d.invoiceDate : d.date;
      const amtTxt = type === 'dk' ? (calcDK(d).net + ' kg') : '₹ ' + money(amountOf(type, d));
      const card = h('div', { class: 'entry' + (opened.has(e.id) ? ' open' : '') + (regSel === e.id ? ' picked' : ''), style: '--ac:' + T.c }, h('div', { class: 'l1', onclick: () => { regSel = e.id; if (opened.has(e.id)) opened.delete(e.id); else opened.add(e.id); draw(); } }, h('span', {}, type === 'dk' ? h('input', { type: 'checkbox', checked: sel.includes(e.id), style: 'width:22px;height:22px;margin-right:8px;vertical-align:middle', onclick: ev => ev.stopPropagation(), onchange: ev => { if (ev.target.checked) { if (sel.length >= 3) { ev.target.checked = false; toast('A maximum of 3 bills fit on one page', 'err'); return; } sel.push(e.id); } else sel = sel.filter(x => x !== e.id); upd(); } }) : null, T.keyLabel + ' ' + e.key, h('span', { class: 'tag' }, e.id), e.status !== 'Saved' ? h('span', { class: 'tag' }, e.status) : null, regSel === e.id ? h('span', { class: 'seltag' }, '✓ SELECTED') : null), h('span', { style: 'color:' + T.c2 }, amtTxt)),
        h('div', { class: 'l2', onclick: () => { regSel = e.id; if (opened.has(e.id)) opened.delete(e.id); else opened.add(e.id); draw(); } }, (whoOf(type, d) || '—') + ' • ' + dmy(dt) + (type === 'dk' && d.vehicle ? ' • ' + d.vehicle : '')),
        '');
      list.append(card);
    });
  };
  const upd = () => { if (mb) mb.textContent = 'SAME PAGE (' + sel.length + ')'; };
  q.addEventListener('input', draw); draw();
  upd();
}

/* ----- settings ----- */
function storageStrip() {
  const ok = hasBridge() && AndroidBridge.storageOk && AndroidBridge.storageOk();
  if (!hasBridge()) return h('div', { class: 'strip' }, h('span', {}, '📁'), h('div', {}, h('b', {}, 'Files'), h('small', {}, 'In a browser, PDF and backup files go to Downloads')));
  return h('div', { class: 'strip' + (ok ? '' : ' warn') }, h('span', {}, ok ? '📁' : '⚠️'), h('div', {}, h('b', {}, ok ? 'InvoiceApp folder is ready' : 'Folder access needed'), h('small', {}, ok ? 'Phone storage > InvoiceApp > PDF · Backup · Images' : 'Files are saved in Documents/InvoiceApp for now')),
    ok ? null : h('button', { class: 'btn sm ok', onclick: () => { extBusy(); AndroidBridge.requestStorage(); } }, 'ALLOW'));
}
async function doBackupSave() { try { toast('Saved: ' + await saveXLSX(), 'good'); } catch (e) { toast(e.message, 'err'); } }
async function doBackupShare() { try { await shareBytes(XLSM_NAME, await buildXLSM(), XLSM_MIME, ''); } catch (e) { toast('Could not share: ' + e.message, 'err'); } }
function pickMacro() { const i = h('input', { type: 'file', accept: '.xlsm', style: 'display:none', onchange: async () => { const f = i.files[0]; if (!f) return; try { await setTemplate(new Uint8Array(await f.arrayBuffer())); toast('Macros template set. Future saves will use this file.', 'good'); } catch (e) { toast(e.message, 'err'); } } }); document.body.append(i); extBusy(); i.click(); setTimeout(() => i.remove(), 60000); }
async function clearEverything() {
  if (!await yn('Delete all data?', 'All registers and drafts will be deleted permanently.\nSave a backup first!', true)) return;
  if (secOn() && !await pinVerifyFlow('Enter PIN to confirm')) return;
  if (!await yn('Please confirm', 'This cannot be undone.\nReally delete ALL DATA?', true)) return;
  DB.dk = []; DB.sb = []; DB.tt = []; DB.drafts = {}; cur = {}; sel = []; persist(); toast('All data deleted', 'good'); go('home');
}
function screenSettings() {
  document.querySelector('meta[name=theme-color]').setAttribute('content', '#0f172a');
  const app = $('#app'); app.innerHTML = '';
  app.append(topbar('Settings', 'Security • Files • Backup', ['#0f172a', '#1e293b'], { t: '←', fn: () => go('home') }));
  const w = h('div', { class: 'wrap' }); app.append(w);
  const tg = (val, fn, dis) => { const i = h('input', { type: 'checkbox', class: 'tg' }); i.checked = !!val; if (dis) i.disabled = true; i.addEventListener('change', () => fn(i.checked, i)); return i; };
  const row = (ic, t, sub, right, fn) => h('div', { class: 'srow' + (fn ? ' tap' : ''), onclick: fn || null }, h('span', { class: 'sic' }, ic), h('div', { class: 'stx' }, h('b', {}, t), sub ? h('small', {}, sub) : null), right || null);
  const card = (t, ...rows) => h('div', { class: 'scard' }, h('h3', {}, t), rows);

    row('🔒', 'App lock (PIN)', secOn() ? 'On - a PIN is needed to open the app' : 'Off - anyone can open the app', tg(secOn(), async (on, el) => {
      if (on) { if (await pinSetupFlow('Set a new PIN')) toast('App lock is on', 'good'); }
      else { if (await pinVerifyFlow('Enter PIN to turn off the lock')) { SEC.on = false; SEC.hash = ''; SEC.dev = false; secSave(); toast('App lock is off'); } }
      screenSettings();
    }))];
  if (secOn()) {
    secRows.push(row('✏️', 'Change PIN', 'Set a new PIN using the current one', h('span', { class: 'chev' }, '›'), async () => { if (await pinVerifyFlow('Enter current PIN') && await pinSetupFlow('New PIN')) { toast('PIN changed', 'good'); } screenSettings(); }));
    const sel_ = h('select', { class: 'ssel', onchange: () => { SEC.delay = +sel_.value; secSave(); } }, [[15, '15 sec'], [60, '1 min'], [300, '5 min'], [31536000, 'Only after the app is closed']].map(o => h('option', { value: o[0] }, o[1])));
    sel_.value = String(SEC.delay);
    secRows.push(row('⏱️', 'Auto-lock', 'Lock after the app has been in the background for', sel_));
    if (devOk) secRows.push(row('🔓', 'Unlock with phone lock', 'Fingerprint / pattern / phone PIN', tg(SEC.dev, (on, el) => {
      if (!on) { SEC.dev = false; secSave(); return; }
      window.__devAuthCb = ok => { if (ok) { SEC.dev = true; secSave(); toast('Phone lock unlock is on', 'good'); } else { SEC.dev = false; el.checked = false; toast('Phone lock verification failed', 'err'); } };
      extBusy(); AndroidBridge.deviceAuth();
    })));
  }
  secRows.push(row('🛡️', 'Block screenshots and hide in recent apps', hasBridge() ? 'The screen will not appear in screenshots or the recent apps list' : 'Android app only', tg(hasBridge() && AndroidBridge.isSecure && AndroidBridge.isSecure(), on => { if (hasBridge()) AndroidBridge.setSecure(on); }, !hasBridge())));
  w.append(card('Security', secRows));
  /* auto save */
  const sv = (k, ic, t, sub) => row(ic, t, sub, tg(DB.settings[k], on => { DB.settings[k] = on; persist(); }));
  w.append(card('Auto save', sv('autoPdf', '📄', 'Bill PDF', 'ADD ENTRY saves a PDF in InvoiceApp/PDF'), sv('autoXlsx', '📊', 'Excel (XLSM) - 6 tab', 'ADD ENTRY updates InvoiceApp/Backup/Invoice_Bill.xlsm'), sv('lakh', '🔢', 'Lakh / Crore style', 'Amount in words: "Three lakh forty-two thousand"')));
  /* files */
  const stOk = hasBridge() && AndroidBridge.storageOk && AndroidBridge.storageOk();
  w.append(card('Files & folders', storageStrip(),
    row('📂', 'Phone storage > InvoiceApp', null, null),
    row('📄', 'PDF', 'PDF files of your bills', null), row('💾', 'Backup', 'Invoice_Bill.xlsm (all data + macros)', null), row('🖼️', 'Images', 'PNG images you shared', null),
    h('p', { class: 'mute', style: 'margin:6px 2px 0' }, 'Tip: Backup and PDF files are normal files - keep your phone screen lock on.')));
  /* backup */
  w.append(card('Backup & restore', h('div', { class: 'grid2' }, btn('💾 Save backup', 'ok', doBackupSave), btn('📤 Share backup', 'vi', doBackupShare), btn('📥 Restore', 'ind', restorePick), btn('🧩 Macros .xlsm', 'sl', pickMacro)),
    h('p', { class: 'mute', style: 'margin:8px 2px 0' }, 'A backup holds all entries and macros. If you change phones, Restore brings everything back.')));
  /* data */
  w.append(card('Data', row('🗂️', 'Entries', 'DK ' + DB.dk.length + ' • SB ' + DB.sb.length + ' • TT ' + DB.tt.length, null), row('🗑️', 'Delete all data', 'Registers + drafts. You will be asked to confirm first', h('span', { class: 'chev bad' }, '›'), clearEverything)));
  w.append(h('p', { class: 'mute', style: 'text-align:center;margin:14px 0' }, 'Invoice Manager • version 17 • 100% offline (no internet permission)'));
}
window.onStorageChange = () => { if (location.hash === '#/settings' && !locked) screenSettings(); else if (location.hash === '#/home' || !location.hash) { if (!locked) screenHome(); } };

/* ----- router ----- */
function route() {
  const p = (location.hash || '#/home').replace(/^#\//, '').split('/'); $$('.modal,.toast').forEach(x => x.remove()); liveEl = null;
  const [s, a, b] = p; window.scrollTo(0, 0);
  if (s === 'form' && TYPES[a]) screenForm(a); else if (s === 'reg' && TYPES[a]) screenReg(a); else if (s === 'blank') screenBlank(a); else if (s === 'multi' && a) screenMulti(a); else if (s === 'preview' && TYPES[a]) screenPreview(a, b); else if (s === 'settings') screenSettings(); else screenHome();
}
window.addEventListener('hashchange', route);
loadDB(); secInit(); route();
setTimeout(() => { if (hasBridge() && AndroidBridge.storageOk && !AndroidBridge.storageOk() && !DB.settings.askedStorage && !locked) { DB.settings.askedStorage = true; persist(); yn('Create the InvoiceApp folder?', 'To create the "InvoiceApp" folder (PDF, Backup, Images) in your phone storage, allow "All files access".\n\nTurn "Allow" ON on the next screen.', false).then(ok => { if (ok) { extBusy(); AndroidBridge.requestStorage(); } }); } }, 900);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
